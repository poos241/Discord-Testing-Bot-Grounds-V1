{% extends "base.html" %}

{% block title %}Profile — Kush Bush{% endblock %}

{% block body %}
<!-- Custom profile background (fixed, behind everything) -->
<div id="public-page-bg" style="display:none;position:fixed;inset:0;z-index:-1;
    background-size:cover;background-position:center;"></div>
<div id="public-page-bg-overlay" style="display:none;position:fixed;inset:0;z-index:-1;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.2) 0%, rgba(0,0,0,.68) 100%), linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.72));"></div>

<style>
#public-layout { display:grid; grid-template-columns: 1fr 320px; gap:20px; align-items:start; }
#public-layout > div { margin-top: 0 !important; }
#public-card { grid-column: 1 / -1; grid-row: 1; }
#public-stats { grid-column: 1; grid-row: 2; }
#public-featured { grid-column: 2; grid-row: 2; }
#public-activity { grid-column: 1; grid-row: 3; }
#public-badges { grid-column: 2; grid-row: 3; }
@media (max-width: 800px) {
  #public-layout { grid-template-columns: 1fr; }
  #public-card { grid-column: 1; grid-row: 1; }
  #public-stats { grid-column: 1; grid-row: 2; }
  #public-activity { grid-column: 1; grid-row: 3; }
  #public-featured { grid-column: 1; grid-row: 4; }
  #public-badges { grid-column: 1; grid-row: 5; }
}

/* Steam-style translucent panels + gradient section header bars */
#public-card, #public-stats, #public-badges, #public-activity, #public-featured { background: rgba(13,17,28,.78) !important; backdrop-filter: blur(8px); border-color: rgba(255,255,255,.12) !important; }
#public-stats > h3, #public-badges > h3, #public-activity > h3, #public-featured > h3 { background: linear-gradient(90deg, rgba(42,71,94,.95), rgba(42,71,94,0)); margin: -24px -32px 16px !important; padding: 12px 32px !important; border-radius: 12px 12px 0 0; }
#public-card h2 { font-size: 2rem; }
#public-avatar, #public-avatar-fallback { width:112px !important; height:112px !important; }
.stat-cell, .activity-row, .badge-item { transition: transform .15s ease, border-color .15s ease; }
.stat-cell:hover, .activity-row:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.28) !important; }
.badge-item { background:#1e1f24; border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px 10px; text-align:center; min-width:84px; }
.badge-item:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.3); }
</style>
<div id="public-layout" style="max-width:1000px;margin:40px auto;padding:0 16px;">

    <div id="public-card" style="display:none;background:rgba(255,255,255,.03);
        border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;">
        <div id="public-banner" style="height:140px;background:#5865F2;
            background-size:cover;background-position:center;"></div>
        <div style="padding:0 32px 32px;margin-top:-48px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">
            <div style="flex:1;min-width:280px;">
            <img id="public-avatar" src="" alt=""
                style="width:96px;height:96px;border-radius:50%;
                border:4px solid #1e1f24;background:#1e1f24;display:none;">
            <div id="public-avatar-fallback" style="width:96px;height:96px;border-radius:50%;
                background:#5865F2;border:4px solid #1e1f24;display:none;
                align-items:center;justify-content:center;
                font-size:2.5rem;font-weight:800;color:#fff;">?</div>
            <h2 style="margin:12px 0 4px;">
                <span id="public-name"></span>
                <span id="public-pronouns" style="font-size:.9rem;font-weight:400;
                    opacity:.6;"></span>
            </h2>
            <p id="public-status" style="opacity:.9;margin:12px 0 0;
                font-style:italic;display:none;"></p>
            <p id="public-bio" style="opacity:.8;margin:12px 0 0;line-height:1.5;"></p>
            <div id="public-tags" style="display:flex;gap:8px;
                flex-wrap:wrap;margin-top:12px;"></div>
            <div id="public-socials" style="display:flex;gap:10px;
                flex-wrap:wrap;margin-top:14px;"></div>
            </div>
            <div style="text-align:center;flex-shrink:0;padding-top:8px;">
                <div style="position:relative;width:96px;height:96px;margin:0 auto;">
                    <svg width="96" height="96" viewBox="0 0 96 96">
                        <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>
                        <circle id="public-level-ring" cx="48" cy="48" r="42" fill="none" stroke="#5865F2" stroke-width="5" stroke-linecap="round" transform="rotate(-90 48 48)" stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
                    </svg>
                    <span id="public-level-number" style="position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-weight:800;">?</span>
                </div>
                <div style="font-weight:700;margin-top:8px;">Level</div>
                <div id="public-level-xp" style="opacity:.6;font-size:.85rem;"></div>
                <div id="public-member-since" style="opacity:.6;font-size:.85rem;margin-top:4px;"></div>
            </div>
        </div>
    </div>

    <div id="public-featured" style="display:none;background:rgba(255,255,255,.03);
        border:1px solid rgba(255,255,255,.08);border-radius:16px;
        padding:24px 32px;margin-top:20px;">
        <h3 style="margin:0 0 16px;">Featured</h3>
        <div id="public-featured-content" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
    </div>

    <div id="public-stats" style="display:none;background:rgba(255,255,255,.03);
        border:1px solid rgba(255,255,255,.08);border-radius:16px;
        padding:24px 32px;margin-top:20px;">
        <h3 style="margin:0 0 16px;">Bot stats</h3>
        <div id="public-stats-grid" style="display:grid;
            grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;"></div>
        <div id="public-progress-box" style="margin-top:16px;display:none;">
            <div style="display:flex;justify-content:space-between;
                font-size:.9rem;margin-bottom:6px;">
                <span id="public-progress-label"></span>
                <span id="public-progress-numbers"></span>
            </div>
            <div style="height:12px;border-radius:6px;background:#1e1f24;
                border:1px solid rgba(255,255,255,.08);overflow:hidden;">
                <div id="public-progress-bar" style="height:100%;background:#5865F2;
                    width:0%;transition:width .5s;"></div>
            </div>
        </div>
    </div>

    <div id="public-badges" style="display:none;background:rgba(255,255,255,.03);
        border:1px solid rgba(255,255,255,.08);border-radius:16px;
        padding:24px 32px;margin-top:20px;">
        <h3 id="public-badges-title" style="margin:0 0 16px;">Achievements</h3>
        <div id="public-badge-grid" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
    </div>

    <div id="public-activity" style="display:none;background:rgba(255,255,255,.03);
        border:1px solid rgba(255,255,255,.08);border-radius:16px;
        padding:24px 32px;margin-top:20px;">
        <h3 style="margin:0 0 16px;">Recent activity</h3>
        <div id="public-activity-list" style="display:grid;gap:10px;"></div>
    </div>

    <div id="public-error" style="display:none;text-align:center;padding:64px 24px;">
        <div style="font-size:3rem;">🔒</div>
        <h2>This profile isn't public</h2>
        <p style="opacity:.7;">The user hasn't shared their profile, or it doesn't exist.</p>
        <a href="{{ url_for('home') }}"
            style="display:inline-block;margin-top:12px;padding:10px 20px;
            border-radius:8px;background:#5865F2;color:#fff;text-decoration:none;
            font-weight:600;">Back home</a>
    </div>

</div>

<script>
(function() {
    var SOCIAL_LABELS = {twitch: "Twitch", youtube: "YouTube", twitter: "Twitter / X", website: "Website"};
    var STAT_LABELS = {level: "Level", xp: "Total XP", played: "Games played", points: "Game points", daily_streak: "Daily streak"};
    var userId = "{{ user_id }}";
    var $ = function(id) { return document.getElementById(id); };

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
            return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
        });
    }

    function activityText(a) {
        var d = a.detail || {};
        if (a.kind === "level_up") return "\uD83C\uDF89 Reached level " + (d.level || "?");
        if (a.kind === "daily_claim") return "\uD83C\uDF81 Claimed daily reward (" + (d.streak || 1) + "-day streak)";
        if (a.kind === "game_round") {
            var pts = d.majority ? "(+" + (d.points || 0) + " pts, with the majority)" : "(against the crowd)";
            return "\uD83C\uDFAE Eat It or Yeet It: " + (d.food || "something") + " \u2014 voted " + (d.voted || "?") + ", verdict " + (d.verdict || "?") + " " + pts;
        }
        return a.kind;
    }

    fetch("/api/profile/public/" + encodeURIComponent(userId), {credentials: "same-origin"})
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
            if (!data || !data.success) {
                $("public-error").style.display = "";
                return;
            }
            var p = data.profile || {};
            var u = data.user || {};
            var t = (data.stats && data.stats.totals) || {};
            $("public-card").style.display = "";
            $("public-stats").style.display = "";
            $("public-badges").style.display = "";
            $("public-activity").style.display = "";

            var banner = $("public-banner");
            banner.style.background = p.banner
                ? "url(" + p.banner + ") center / cover"
                : (u.banner_url
                    ? "url(" + u.banner_url + ") center / cover"
                    : "linear-gradient(135deg, " + p.accent + ", #14141f)");
            $("public-level-ring").style.stroke = p.accent;

            if (p.background_url) {
                $("public-page-bg").style.backgroundImage = "url(" + p.background_url + ")";
                $("public-page-bg").style.display = "";
                $("public-page-bg-overlay").style.display = "";
            }

            var name = p.display_name || u.display_name || ("User " + userId);
            $("public-name").textContent = name;
            $("public-pronouns").textContent = p.pronouns ? "(" + p.pronouns + ")" : "";
            if (p.avatar_url || u.avatar_url) {
                var img = $("public-avatar");
                img.src = p.avatar_url || u.avatar_url;
                img.style.display = "";
                img.style.boxShadow = "0 0 0 3px " + p.accent + ", 0 0 24px rgba(0,0,0,.6)";
            } else {
                var fb = $("public-avatar-fallback");
                fb.textContent = (name[0] || "?").toUpperCase();
                fb.style.display = "flex";
                fb.style.boxShadow = "0 0 0 3px " + p.accent + ", 0 0 24px rgba(0,0,0,.6)";
            }
            if (data.stats && data.stats.member_since) {
                $("public-member-since").textContent = "Member since " + new Date(data.stats.member_since).toLocaleDateString();
            }
            if (p.status) {
                var st = $("public-status");
                st.textContent = "\u201C" + p.status + "\u201D";
                st.style.display = "";
            }
            $("public-bio").textContent = p.bio || "No bio yet.";

            $("public-tags").innerHTML = (p.tags || []).map(function(tag) {
                return '<span style="font-size:.8rem;background:rgba(255,255,255,.08);'
                    + 'border:1px solid rgba(255,255,255,.12);border-radius:20px;'
                    + 'padding:4px 12px;">' + esc(tag) + "</span>";
            }).join("");

            var socialsHtml = "";
            Object.keys(SOCIAL_LABELS).forEach(function(key) {
                if (p.socials && p.socials[key]) {
                    socialsHtml += '<a href="' + esc(p.socials[key]) + '" target="_blank" rel="noopener" '
                        + 'style="font-size:.85rem;border:1px solid rgba(255,255,255,.15);'
                        + 'border-radius:20px;padding:5px 14px;color:#fff;text-decoration:none;">'
                        + SOCIAL_LABELS[key] + "</a>";
                }
            });
            $("public-socials").innerHTML = socialsHtml;

            var cells = [
                ["Level", t.level || 0],
                ["Total XP", (t.xp || 0).toLocaleString()],
                ["Daily streak", (t.daily_streak || 0) + " days"],
                ["Games played", t.played || 0],
                ["Game points", t.points || 0],
                ["Majority votes", t.majority || 0]
            ];
            $("public-stats-grid").innerHTML = cells.map(function(c) {
                return '<div class="stat-cell" style="background:#1e1f24;border:1px solid rgba(255,255,255,.08);'
                    + 'border-radius:12px;padding:14px;text-align:center;">'
                    + '<div style="font-size:1.4rem;font-weight:800;">' + c[1] + "</div>"
                    + '<div style="opacity:.6;font-size:.8rem;">' + c[0] + "</div></div>";
            }).join("");

            var prog = data.stats && data.stats.best_guild_progress;
            if (prog) {
                $("public-progress-box").style.display = "";
                $("public-progress-label").textContent = "Level " + prog.level + " progress";
                $("public-progress-numbers").textContent = prog.xp.toLocaleString() + " / " + prog.xp_needed.toLocaleString() + " XP";
                $("public-progress-bar").style.width = prog.progress_pct + "%";
            }
            $("public-level-number").textContent = prog ? prog.level : (t.level || 0);
            $("public-level-xp").textContent = (t.xp || 0).toLocaleString() + " XP";
            $("public-level-ring").style.strokeDashoffset = 263.9 * (1 - (prog ? prog.progress_pct : 0) / 100);

            var badges = (data.badges || []).filter(function(b) { return b.earned; });
            $("public-badges-title").textContent = "Badges " + badges.length;
            $("public-badge-grid").innerHTML = badges.length
                ? badges.map(function(b) {
                    return '<div class="badge-item" title="' + esc(b.description) + '" style="">'
                        + '<div style="font-size:1.6rem;">' + b.icon + "</div>"
                        + '<div style="font-size:.8rem;font-weight:700;margin-top:4px;">' + esc(b.name) + "</div></div>";
                }).join("")
                : '<div style="opacity:.5;">No achievements yet.</div>';

            var parts = [];
            if (p.featured_badge) {
                var fbd = badges.filter(function(b) { return b.key === p.featured_badge; })[0];
                if (fbd) {
                    parts.push('<div style="background:#1e1f24;border:1px solid rgba(255,255,255,.15);'
                        + 'border-radius:12px;padding:14px 18px;text-align:center;">'
                        + '<div style="font-size:1.8rem;">' + fbd.icon + "</div>"
                        + '<div style="font-size:.85rem;font-weight:700;margin-top:4px;">' + esc(fbd.name) + "</div>"
                        + '<div style="opacity:.6;font-size:.75rem;">Featured badge</div></div>');
                }
            }
            if (p.featured_stat && STAT_LABELS[p.featured_stat]) {
                var val = t[p.featured_stat];
                if (p.featured_stat === "xp" || p.featured_stat === "points" || p.featured_stat === "played") val = (val || 0).toLocaleString();
                if (p.featured_stat === "daily_streak") val = (val || 0) + " days";
                parts.push('<div style="background:#1e1f24;border:1px solid rgba(255,255,255,.15);'
                    + 'border-radius:12px;padding:14px 18px;text-align:center;">'
                    + '<div style="font-size:1.6rem;font-weight:800;">' + val + "</div>"
                    + '<div style="opacity:.6;font-size:.8rem;">' + STAT_LABELS[p.featured_stat] + "</div>"
                    + '<div style="opacity:.6;font-size:.75rem;">Featured stat</div></div>');
            }
            if (parts.length) {
                $("public-featured").style.display = "";
                $("public-featured-content").innerHTML = parts.join("");
            }

            var activity = data.activity || [];
            $("public-activity-list").innerHTML = activity.length
                ? activity.map(function(a) {
                    var when = a.ts ? new Date(a.ts * 1000).toLocaleString() : "";
                    return '<div class="activity-row" style="display:flex;gap:12px;align-items:baseline;'
                        + 'background:#1e1f24;border:1px solid rgba(255,255,255,.08);'
                        + 'border-radius:12px;padding:12px 16px;">'
                        + '<div style="flex:1;">' + esc(activityText(a)) + "</div>"
                        + '<div style="opacity:.5;font-size:.8rem;white-space:nowrap;">' + when + "</div></div>";
                }).join("")
                : '<div style="opacity:.5;">No activity yet.</div>';
        })
        .catch(function() {
            $("public-error").style.display = "";
        });
})();
</script>
{% endblock %}
