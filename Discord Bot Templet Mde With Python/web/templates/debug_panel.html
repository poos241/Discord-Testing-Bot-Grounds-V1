    <!-- Debug panel (toggle via /api/debug/toggle) -->
    <style>
        #dbg-fab {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            width: 44px; height: 44px; border-radius: 50%;
            background: #2a2d34; border: 1px solid rgba(255,255,255,.15);
            color: #fff; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        #dbg-fab:hover { background: #3a3e47; }
        #dbg-fab.on { background: #7a2e2e; border-color: #c0392b; }
        #dbg-panel {
            position: fixed; bottom: 74px; right: 20px; z-index: 9999;
            width: 380px; max-height: 480px; overflow-y: auto;
            background: #1e1f24; border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px; padding: 14px; display: none;
            font-size: .8rem; box-shadow: 0 8px 32px rgba(0,0,0,.5);
        }
        #dbg-panel h4 { margin: 0 0 8px; font-size: .9rem; }
        #dbg-panel .dbg-row {
            padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.05);
            font-family: monospace; font-size: .72rem;
            display: flex; justify-content: space-between; gap: 8px;
        }
        #dbg-panel .dbg-err { color: #ff7b7b; }
        #dbg-panel .dbg-ok { color: #7dffa8; }
        #dbg-toggle-btn {
            width: 100%; padding: 8px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; margin-bottom: 10px;
        }
        #dbg-toggle-btn.on { background: #c0392b; color: #fff; }
        #dbg-toggle-btn.off { background: #27ae60; color: #fff; }
    </style>
    <button id="dbg-fab" title="Debug panel">🐛</button>
    <div id="dbg-panel">
        <h4>🐛 Debug Panel</h4>
        <button id="dbg-toggle-btn" class="off">Enable Debug</button>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
            <button id="dbg-clear-web" style="flex:1;padding:6px;border:none;border-radius:6px;background:#4a4e59;color:#fff;cursor:pointer;font-size:.75rem;">Clear Web Log</button>
            <button id="dbg-clear-all" style="flex:1;padding:6px;border:none;border-radius:6px;background:#4a4e59;color:#fff;cursor:pointer;font-size:.75rem;">Clear All Logs</button>
        </div>
        <div style="opacity:.6;margin-bottom:6px;">Recent requests:</div>
        <div id="dbg-requests"><div style="opacity:.5;">No data yet.</div></div>
        <div style="opacity:.6;margin:10px 0 6px;">Server log (data/web_debug.log):</div>
        <div id="dbg-weblog" style="max-height:200px;overflow-y:auto;background:#141518;border-radius:6px;padding:6px;font-family:monospace;font-size:.68rem;white-space:pre-wrap;word-break:break-all;"><div style="opacity:.5;">No log lines yet.</div></div>
    </div>
    <script>
    (function() {
        var fab = document.getElementById("dbg-fab");
        var panel = document.getElementById("dbg-panel");
        var toggleBtn = document.getElementById("dbg-toggle-btn");
        var reqList = document.getElementById("dbg-requests");
        var csrfToken = null;

        async function getCsrf() {
            if (csrfToken) return csrfToken;
            try {
                var r = await fetch("/api/csrf", {credentials: "same-origin"});
                var d = await r.json();
                csrfToken = d.csrf_token || d.token || "";
            } catch (e) {}
            return csrfToken;
        }

        async function refreshStatus() {
            try {
                var r = await fetch("/api/debug/status", {credentials: "same-origin"});
                var d = await r.json();
                var on = !!(d.success && d.enabled);
                fab.classList.toggle("on", on);
                toggleBtn.textContent = on ? "Disable Debug" : "Enable Debug";
                toggleBtn.className = on ? "on" : "off";
                if (on) { loadRequests(); loadWeblog(); }
            } catch (e) {}
        }

        async function loadWeblog() {
            try {
                var r = await fetch("/api/debug/weblog", {credentials: "same-origin"});
                var d = await r.json();
                var box = document.getElementById("dbg-weblog");
                if (!d.success || !d.lines.length) {
                    box.innerHTML = '<div style="opacity:.5;">No log lines yet.</div>';
                    return;
                }
                box.textContent = d.lines.slice(-40).join("\n");
                box.scrollTop = box.scrollHeight;
            } catch (e) {}
        }

        async function loadRequests() {
            try {
                var r = await fetch("/api/debug/requests", {credentials: "same-origin"});
                var d = await r.json();
                if (!d.success || !d.requests.length) {
                    reqList.innerHTML = '<div style="opacity:.5;">No requests logged yet.</div>';
                    return;
                }
                reqList.innerHTML = d.requests.slice(0, 30).map(function(req) {
                    var cls = req.status >= 400 ? "dbg-err" : "dbg-ok";
                    return '<div class="dbg-row"><span>' + req.method + ' ' +
                        req.path.substring(0, 42) + '</span><span class="' + cls + '">' +
                        req.status + ' · ' + req.ms + 'ms</span></div>';
                }).join("");
            } catch (e) {}
        }

        var weblogTimer = null;

        fab.addEventListener("click", function() {
            var isOpen = panel.style.display !== "block";
            panel.style.display = isOpen ? "block" : "none";
            if (isOpen) {
                refreshStatus();
                // Live-tail the server log every 3s while open
                if (weblogTimer) clearInterval(weblogTimer);
                weblogTimer = setInterval(function() {
                    if (panel.style.display === "block") loadWeblog();
                }, 3000);
            } else {
                if (weblogTimer) { clearInterval(weblogTimer); weblogTimer = null; }
            }
        });

        toggleBtn.addEventListener("click", async function() {
            var token = await getCsrf();
            try {
                var r = await fetch("/api/debug/toggle", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {"Content-Type": "application/json", "X-CSRF-Token": token},
                    body: JSON.stringify({})
                });
                await r.json();
                csrfToken = null;
                refreshStatus();
            } catch (e) {}
        });

        // Capture JS errors into the panel when open
        window.addEventListener("error", function(e) {
            if (panel.style.display !== "block") return;
            var div = document.createElement("div");
            div.className = "dbg-row";
            div.innerHTML = '<span class="dbg-err">JS: ' +
                String(e.message).substring(0, 60) + '</span>';
            reqList.prepend(div);
        });

        async function clearLogs(which) {
            var token = await getCsrf();
            try {
                var r = await fetch("/api/debug/clear-logs", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {"Content-Type": "application/json", "X-CSRF-Token": token},
                    body: JSON.stringify({which: which})
                });
                var d = await r.json();
                csrfToken = null;
                if (d.success) { loadWeblog(); loadRequests(); }
            } catch (e) {}
        }

        document.getElementById("dbg-clear-web").addEventListener("click", function() { clearLogs("web"); });
        document.getElementById("dbg-clear-all").addEventListener("click", function() { clearLogs("all"); });

        refreshStatus();
    })();
    </script>
    {% endif %}
